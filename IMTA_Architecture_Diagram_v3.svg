<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="610" viewBox="0 0 680 610" role="img">
<title>IMTA System Architecture</title>
<desc>Field hardware: a Jetson commands one or more control boxes, each containing sensors. The Jetson communicates via the Particle platform up to a Firestore database (project marinesitu-imta) with two collections. The chosen access path is the Firebase Admin SDK reading directly from Firestore.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <style>
    .label-title { font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; font-size: 14px; font-weight: 500; }
    .label-sub   { font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; font-size: 12px; font-weight: 400; }
    .label-mono  { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 13px; font-weight: 500; }
    .arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
  </style>
</defs>

<!-- ===== TIER 1: FIELD HARDWARE ===== -->
<rect x="80" y="116" width="130" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="label-title" x="145" y="138" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">Jetson</text>

<line x1="210" y1="138" x2="330" y2="138" class="arr" marker-end="url(#arrow)"/>

<rect x="346" y="86" width="240" height="120" rx="14" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5" opacity="0.35"/>
<rect x="338" y="78" width="240" height="120" rx="14" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5" opacity="0.65"/>
<rect x="330" y="70" width="240" height="120" rx="14" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="label-title" x="450" y="92" text-anchor="middle" fill="#2C2C2A">Control box</text>
<text class="label-sub" x="450" y="110" text-anchor="middle" fill="#5F5E5A">(one or more)</text>

<rect x="370" y="128" width="160" height="44" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text class="label-title" x="450" y="150" text-anchor="middle" dominant-baseline="central" fill="#712B13">Sensors</text>

<line x1="145" y1="160" x2="145" y2="228" class="arr" marker-end="url(#arrow)"/>
<text class="label-sub" x="155" y="198" fill="#5F5E5A">via Particle</text>

<!-- ===== TIER 2: FIRESTORE CONTAINER ===== -->
<rect x="70" y="230" width="540" height="140" rx="14" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="label-title" x="340" y="253" text-anchor="middle" fill="#0C447C">Firestore database (default)</text>
<text class="label-mono" x="340" y="272" text-anchor="middle" fill="#185FA5">project: marinesitu-imta</text>

<rect x="100" y="288" width="240" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="label-mono" x="220" y="306" text-anchor="middle" dominant-baseline="central" fill="#085041">imta_telemetry</text>
<text class="label-sub" x="220" y="326" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">Time-series readings</text>

<rect x="370" y="288" width="210" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="label-mono" x="475" y="306" text-anchor="middle" dominant-baseline="central" fill="#085041">imta_devices</text>
<text class="label-sub" x="475" y="326" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">Status snapshot (TBD)</text>

<line x1="180" y1="370" x2="180" y2="420" class="arr" marker-end="url(#arrow)"/>
<line x1="500" y1="370" x2="500" y2="420" class="arr" marker-end="url(#arrow)"/>

<!-- ===== TIER 3: ACCESS PATHS ===== -->
<!-- Option A (not chosen) - default styling -->
<rect x="80" y="422" width="200" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="label-title" x="180" y="440" text-anchor="middle" dominant-baseline="central" fill="#3C3489">imta-dashboard API</text>
<text class="label-sub" x="180" y="460" text-anchor="middle" dominant-baseline="central" fill="#534AB7">GET endpoints (JWT auth)</text>

<!-- Option B (chosen) - thicker stroke, checkmark badge -->
<rect x="400" y="422" width="200" height="56" rx="8" fill="#EEEDFE" stroke="#3C3489" stroke-width="2"/>
<text class="label-title" x="500" y="440" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Firebase Admin SDK</text>
<text class="label-sub" x="500" y="460" text-anchor="middle" dominant-baseline="central" fill="#534AB7">Direct reads (ADC)</text>
<!-- Chosen badge -->
<rect x="544" y="408" width="64" height="20" rx="10" fill="#0F6E56" stroke="none"/>
<text class="label-sub" x="576" y="418" text-anchor="middle" dominant-baseline="central" fill="#FFFFFF" font-weight="500">✓ chosen</text>

<!-- Merge to Tier 4 -->
<path d="M 180 478 L 180 510 L 340 510" class="arr"/>
<path d="M 500 478 L 500 510 L 340 510" class="arr"/>
<line x1="340" y1="510" x2="340" y2="532" class="arr" marker-end="url(#arrow)"/>

<!-- ===== TIER 4: USER'S WORK ===== -->
<rect x="220" y="534" width="240" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text class="label-mono" x="340" y="552" text-anchor="middle" dominant-baseline="central" fill="#633806">fetch_imta_data.py</text>
<text class="label-sub" x="340" y="572" text-anchor="middle" dominant-baseline="central" fill="#854F0B">Query and analyze</text>
</svg>
