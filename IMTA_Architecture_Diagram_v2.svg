<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="600" viewBox="0 0 680 600" role="img">
<title>IMTA System Architecture</title>
<desc>Field hardware: a Jetson commands one or more control boxes, each containing sensors. The Jetson communicates via the Particle platform up to a Firestore database with two collections. The researcher accesses the data via the imta-dashboard API or directly via the Firebase Admin SDK.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <style>
    .label-title { font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; font-size: 14px; font-weight: 500; }
    .label-sub   { font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; font-size: 12px; font-weight: 400; }
    .arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
  </style>
</defs>

<!-- ===== TIER 1: FIELD HARDWARE ===== -->
<!-- Jetson -->
<rect x="80" y="116" width="130" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="label-title" x="145" y="138" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">Jetson</text>

<!-- Arrow Jetson → Control box -->
<line x1="210" y1="138" x2="330" y2="138" class="arr" marker-end="url(#arrow)"/>

<!-- Control box stack (back-to-front for "one or more" visual) -->
<rect x="346" y="86" width="240" height="120" rx="14" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5" opacity="0.35"/>
<rect x="338" y="78" width="240" height="120" rx="14" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5" opacity="0.65"/>
<rect x="330" y="70" width="240" height="120" rx="14" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="label-title" x="450" y="92" text-anchor="middle" fill="#2C2C2A">Control box</text>
<text class="label-sub" x="450" y="110" text-anchor="middle" fill="#5F5E5A">(one or more)</text>

<!-- Sensors nested inside control box -->
<rect x="370" y="128" width="160" height="44" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text class="label-title" x="450" y="150" text-anchor="middle" dominant-baseline="central" fill="#712B13">Sensors</text>

<!-- Vertical arrow Jetson → Firestore, labeled "via Particle" -->
<line x1="145" y1="160" x2="145" y2="228" class="arr" marker-end="url(#arrow)"/>
<text class="label-sub" x="155" y="198" fill="#5F5E5A">via Particle</text>

<!-- ===== TIER 2: FIRESTORE CONTAINER ===== -->
<rect x="70" y="230" width="540" height="130" rx="14" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="label-title" x="340" y="253" text-anchor="middle" fill="#0C447C">Firestore database (default)</text>

<rect x="100" y="280" width="240" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="label-title" x="220" y="298" text-anchor="middle" dominant-baseline="central" fill="#085041">IMTA Telemetry</text>
<text class="label-sub" x="220" y="318" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">Time-series readings</text>

<rect x="370" y="280" width="210" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="label-title" x="475" y="298" text-anchor="middle" dominant-baseline="central" fill="#085041">IMTA Devices</text>
<text class="label-sub" x="475" y="318" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">Sensor status (TBD)</text>

<line x1="180" y1="360" x2="180" y2="410" class="arr" marker-end="url(#arrow)"/>
<line x1="500" y1="360" x2="500" y2="410" class="arr" marker-end="url(#arrow)"/>

<!-- ===== TIER 3: ACCESS PATHS ===== -->
<rect x="80" y="412" width="200" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="label-title" x="180" y="430" text-anchor="middle" dominant-baseline="central" fill="#3C3489">imta-dashboard API</text>
<text class="label-sub" x="180" y="450" text-anchor="middle" dominant-baseline="central" fill="#534AB7">GET endpoints</text>

<rect x="400" y="412" width="200" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="label-title" x="500" y="430" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Firebase Admin SDK</text>
<text class="label-sub" x="500" y="450" text-anchor="middle" dominant-baseline="central" fill="#534AB7">Direct Firestore reads</text>

<!-- Merge to Tier 4 -->
<path d="M 180 468 L 180 500 L 340 500" class="arr"/>
<path d="M 500 468 L 500 500 L 340 500" class="arr"/>
<line x1="340" y1="500" x2="340" y2="522" class="arr" marker-end="url(#arrow)"/>

<!-- ===== TIER 4: USER'S WORK ===== -->
<rect x="240" y="524" width="200" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text class="label-title" x="340" y="542" text-anchor="middle" dominant-baseline="central" fill="#633806">Your script</text>
<text class="label-sub" x="340" y="562" text-anchor="middle" dominant-baseline="central" fill="#854F0B">Query and analyze</text>
</svg>
